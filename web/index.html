<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>c6simc6 · x86-64 in WebAssembly</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<header><h1>c6simc6</h1><span>x86-64 emulator compiled from C6, running in WebAssembly</span></header>
<main>
  <section class="panel">
    <h2>固件与网络</h2>
    <label>固件 URL <input id="fwurl" value="firmware.bin"></label>
    <div class="row">
      <button id="load">加载固件</button>
      <button id="start">启动</button>
      <button id="pause">暂停</button>
      <button id="reset">复位</button>
    </div>
    <label>请求 URL（测试和 guest 网络桥）<input id="neturl" placeholder="https://example.com/"></label>
    <button id="netfetch">fetch 并注入 __net/last</button>
    <h2 style="margin-top:14px">网络代理（wasm 真上网）</h2>
    <label>代理地址 <input id="proxyurl" value="ws://127.0.0.1:8787"></label>
    <div class="row">
      <button id="netconnect">连接</button>
      <button id="netdisconnect">断开</button>
    </div>
    <p id="netstatus">未连接：本机先跑 node tools/ws_slip_proxy.js</p>
    <div class="row">
      <button id="clearcache">清空缓存并重载</button>
    </div>
    <p id="status">空闲</p>
  </section>
  <section class="panel grow">
    <h2>串口（终端）</h2>
    <div id="term"></div>
    <p class="hint">点一下终端后直接输入；Ctrl-C 送 guest，滚轮回看历史。</p>
  </section>
  <section class="panel">
    <h2>页面存储文件表</h2>
    <div class="row">
      <input id="filename" placeholder="文件名">
      <input id="filedata" placeholder="内容">
      <button id="put">写入</button>
      <button id="get">读取</button>
    </div>
    <pre id="fileresult"></pre>
  </section>
</main>
<script src="vendor/xterm.js"></script>
<script src="app.js?v=1.9"></script>
</body>
</html>
